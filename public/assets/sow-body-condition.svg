  <rect width="760" height="420" rx="28" fill="#fffaf4"/>
  <text x="380" y="52" font-family="system-ui,sans-serif" font-size="28" font-weight="800" text-anchor="middle" fill="#573a26">母豚のボディコンディションスコア</text>
  <g transform="translate(30 86)" font-family="system-ui,sans-serif" text-anchor="middle">
    <g transform="translate(0 0)"><path d="M45 40 C65 12 101 12 121 40 L114 190 C111 224 93 244 83 244 C73 244 55 224 52 190 Z" fill="#f4d7c2" stroke="#7c5037" stroke-width="4"/><path d="M75 64 L83 176 L91 64" fill="none" stroke="#7c5037" stroke-width="3"/><text x="83" y="286" font-size="26" font-weight="800" fill="#573a26">1</text><text x="83" y="313" font-size="17" fill="#795b49">やせすぎ</text></g>
    <g transform="translate(140 0)"><path d="M35 44 C60 15 106 15 131 44 L122 188 C118 222 97 244 83 244 C69 244 48 222 44 188 Z" fill="#f2cdb3" stroke="#7c5037" stroke-width="4"/><path d="M72 70 L83 178 L94 70" fill="none" stroke="#7c5037" stroke-width="3"/><text x="83" y="286" font-size="26" font-weight="800" fill="#573a26">2</text><text x="83" y="313" font-size="17" fill="#795b49">やせている</text></g>
    <g transform="translate(280 0)"><rect x="-5" y="-8" width="176" height="276" rx="28" fill="#e9f6ef" stroke="#1f8a70" stroke-width="4" stroke-dasharray="9 7"/><path d="M25 48 C52 15 114 15 141 48 L130 186 C125 225 100 246 83 246 C66 246 41 225 36 186 Z" fill="#edbc99" stroke="#1f6f5e" stroke-width="5"/><path d="M70 79 L83 180 L96 79" fill="none" stroke="#1f6f5e" stroke-width="3"/><text x="83" y="286" font-size="28" font-weight="900" fill="#12614f">3</text><text x="83" y="313" font-size="18" font-weight="800" fill="#12614f">理想的</text></g>
    <g transform="translate(420 0)"><path d="M16 57 C49 20 117 20 150 57 L136 183 C131 226 103 248 83 248 C63 248 35 226 30 183 Z" fill="#e9aa80" stroke="#7c5037" stroke-width="4"/><path d="M72 91 L83 180 L94 91" fill="none" stroke="#7c5037" stroke-width="3"/><text x="83" y="286" font-size="26" font-weight="800" fill="#573a26">4</text><text x="83" y="313" font-size="17" fill="#795b49">太っている</text></g>
    <g transform="translate(560 0)"><path d="M7 70 C44 24 122 24 159 70 L143 180 C138 226 106 250 83 250 C60 250 28 226 23 180 Z" fill="#df9667" stroke="#7c5037" stroke-width="4"/><path d="M76 112 L83 178 L90 112" fill="none" stroke="#7c5037" stroke-width="3"/><text x="83" y="286" font-size="26" font-weight="800" fill="#573a26">5</text><text x="83" y="313" font-size="17" fill="#795b49">太りすぎ</text></g>
