name: Finalize persistent UI language feature

on:
  push:
    branches:
      - feat/persistent-ui-language
    paths:
      - .github/workflows/apply-ui-language-patch.yml

permissions:
  contents: write

jobs:
  finalize-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/persistent-ui-language
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply final persistence fixes
        run: node scripts/finalize_ui_language_feature.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check and unit tests
        run: npm test

      - name: Install browser test runtime
        run: |
          python3 -m pip install --disable-pip-version-check playwright
          python3 -m playwright install chromium

      - name: Mobile and desktop browser checks
        run: python3 e2e/smoke.py

      - name: Commit verified feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore .github/workflows
          git add -A
          git commit -m "fix: finalize persistent bilingual UI and browser tests"
          git push origin HEAD:feat/persistent-ui-language
