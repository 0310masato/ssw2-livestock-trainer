name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install validation and browser-test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check jsonschema playwright==1.54.0
          python3 -m playwright install --with-deps chromium

      - name: Verify generated data is synchronized
        run: npm run check:data-sync

      - name: Validate source facts and pedagogical question data
        run: npm run validate:content

      - name: Type check
        run: npm run typecheck

      - name: Build and run unit tests
        run: npm test

      - name: Run 360px learning-flow and mock-exam browser tests
        run: npm run test:e2e

      - name: Verify deployable files
        run: |
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/.nojekyll
          test -f dist/robots.txt
          test -f dist/standalone-review.html
          test -z "$(find dist -type f -iname '*.pdf' -print -quit)"

      # Internal review only: this expiring artifact is not deployed to Pages.
      - name: Upload 7-day internal review build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: internal-review-build-7d-${{ github.event.pull_request.number || github.run_id }}-attempt-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
