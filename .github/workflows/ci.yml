name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install content-validator dependencies
        run: python3 -m pip install --disable-pip-version-check jsonschema

      - name: Validate source facts and pedagogical question data
        run: npm run validate:content

      - name: Type check
        run: npm run typecheck

      - name: Build and run unit tests
        run: npm test

      - name: Verify deployable files
        run: |
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/.nojekyll
          test -f dist/robots.txt
