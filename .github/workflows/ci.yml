name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install validation and browser-test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check jsonschema playwright==1.54.0
          python3 -m playwright install --with-deps chromium

      - name: Verify generated data is synchronized
        run: npm run check:data-sync

      - name: Validate source facts and pedagogical question data
        run: npm run validate:content

      - name: Type check
        run: npm run typecheck

      - name: Build and run unit tests
        run: npm test

      - name: Run 360px learning-flow and mock-exam browser tests
        run: npm run test:e2e

      - name: Verify deployable files
        run: |
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/.nojekyll
          test -f dist/robots.txt
