name: Verify strict Japanese-only learning mode

on:
  push:
    branches:
      - feat/pedagogical-indonesian-learning
    paths:
      - .github/workflows/strict-japanese-mode.yml

permissions:
  contents: write

concurrency:
  group: strict-japanese-mode
  cancel-in-progress: true

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/pedagogical-indonesian-learning
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply strict Japanese-only presentation
        run: node scripts/patch_strict_japanese_mode.mjs

      - name: Type check and unit tests
        run: npm test

      - name: Install browser test runtime
        run: |
          python3 -m pip install --disable-pip-version-check playwright
          python3 -m playwright install chromium

      - name: Verify guided and Japanese-only modes
        run: python3 e2e/pedagogy_smoke.py

      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore .github/workflows
          rm -f scripts/patch_strict_japanese_mode.mjs
          git add -A
          git commit -m "fix: keep Japanese-only study mode free of translations"
          git push origin HEAD:feat/pedagogical-indonesian-learning
