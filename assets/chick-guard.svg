    <rect x="0" y="275" width="210" height="90" rx="18" fill="#eaf6f1" stroke="#3f8c74" stroke-width="3"/>
    <text x="105" y="310" text-anchor="middle" font-size="20" font-weight="800" fill="#275f4d">取り外し目安</text>
    <text x="105" y="341" text-anchor="middle" font-size="19" fill="#275f4d">夏10日齢・冬13日齢</text>
