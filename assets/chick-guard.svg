  <rect width="760" height="420" rx="28" fill="#fffaf0"/>
  <text x="380" y="48" font-family="system-ui,sans-serif" font-size="29" font-weight="850" text-anchor="middle" fill="#5c431d">チックガード</text>
  <g transform="translate(50 78)">
    <ellipse cx="240" cy="150" rx="195" ry="115" fill="#fff5d6" stroke="#d49a25" stroke-width="9" stroke-dasharray="18 10"/>
    <circle cx="240" cy="145" r="55" fill="#f7c457" opacity=".36"/>
    <path d="M240 30 L240 105" stroke="#574632" stroke-width="6"/>
    <path d="M207 109 Q240 80 273 109 L261 133 L219 133 Z" fill="#e06f2f" stroke="#8e451e" stroke-width="4"/>
    <g fill="#f5c04a" stroke="#7c5924" stroke-width="3">
      <g transform="translate(145 120)"><ellipse cx="0" cy="0" rx="22" ry="16"/><circle cx="18" cy="-9" r="10"/><path d="M27 -9 l12 4 -12 4Z" fill="#e78327"/></g>
      <g transform="translate(185 195)"><ellipse cx="0" cy="0" rx="22" ry="16"/><circle cx="18" cy="-9" r="10"/><path d="M27 -9 l12 4 -12 4Z" fill="#e78327"/></g>
      <g transform="translate(295 184)"><ellipse cx="0" cy="0" rx="22" ry="16"/><circle cx="18" cy="-9" r="10"/><path d="M27 -9 l12 4 -12 4Z" fill="#e78327"/></g>
      <g transform="translate(330 112)"><ellipse cx="0" cy="0" rx="22" ry="16"/><circle cx="18" cy="-9" r="10"/><path d="M27 -9 l12 4 -12 4Z" fill="#e78327"/></g>
      <g transform="translate(252 232)"><ellipse cx="0" cy="0" rx="22" ry="16"/><circle cx="18" cy="-9" r="10"/><path d="M27 -9 l12 4 -12 4Z" fill="#e78327"/></g>
    </g>
    <text x="240" y="298" font-family="system-ui,sans-serif" font-size="18" text-anchor="middle" fill="#78623a">上から見た模式図</text>
  </g>
